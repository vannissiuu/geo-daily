name: 检查并发布网站

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "site/**"
      - "tools/**"
      - "config/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查数据（失败则不发布）
        run: python3 tools/check_data.py

      - name: 生成网站数据包
        run: python3 tools/build_bundle.py

      - name: 准备发布目录
        run: |
          mkdir -p _site/data
          python3 tools/wrap_page.py site/index.html _site/index.html
          cp site/data/bundle.json _site/data/bundle.json
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
